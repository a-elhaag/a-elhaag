<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s{font-family:Georgia,'Times New Roman',serif}
@keyframes b{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.c{animation:b 1.1s step-end infinite}
.a{opacity:0;animation:f .7s ease forwards}
.d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}.d4{animation-delay:1.1s}
</style>
<rect width="900" height="260" rx="14" fill="#111214"/>
<rect x="0.5" y="0.5" width="899" height="259" rx="13.5" fill="none" stroke="#2A2C30"/>
<circle cx="28" cy="26" r="5" fill="#2A2C30"/><circle cx="46" cy="26" r="5" fill="#2A2C30"/><circle cx="64" cy="26" r="5" fill="#2A2C30"/>
<text x="872" y="30" text-anchor="end" class="m" font-size="12" fill="#8A837C">cairo, egypt</text>
<text x="48" y="112" class="s a d1" font-size="56" font-weight="700" fill="#F2EFEA">Anas Abuelhaag</text>
<text x="50" y="150" class="m a d2" font-size="16" fill="#C9A227">full-stack ai engineer</text>
<line x1="50" y1="172" x2="850" y2="172" stroke="#2A2C30"/>
<text x="50" y="206" class="m a d3" font-size="14" fill="#8A837C">$ now --building</text>
<text x="50" y="232" class="m a d4" font-size="14" fill="#F2EFEA">llm systems that ship: agents, receipts, pipelines<tspan class="c" fill="#C9A227"> _</tspan></text>
</svg>